# nginx in front of php-fpm.
#
# `${PORT}` is substituted at container start by the entrypoint, because Render
# assigns the port at run time rather than build time.

server {
    listen ${PORT} default_server;

    server_name _;
    root /var/www/html/public;

    index index.php;

    charset utf-8;

    # Render terminates TLS at its edge and forwards the original scheme here.
    # Laravel needs to see it to build https:// URLs — see TrustProxies in
    # bootstrap/app.php.
    client_max_body_size 32M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Uploaded images and shipped images. Next proxies /storage and /images
    # through to this service — see frontend/next.config.ts.
    location ^~ /storage/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ^~ /images/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;

        fastcgi_read_timeout 120;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
