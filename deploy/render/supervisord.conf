; nginx and php-fpm in one container.
;
; A container dies when its main process dies, so supervisord is the main
; process and both servers are its children. `autorestart=false` is deliberate:
; if either one exits, the whole container should fail and let Render restart
; it, rather than limp along serving half the application.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
autostart=true
autorestart=false
startretries=0
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=false
startretries=0
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; If either server dies, take the container down with it so Render notices and
; restarts a healthy one. Without this supervisord keeps running as PID 1 with a
; dead child, and the service looks up while serving nothing.
[eventlistener:quit_on_failure]
events=PROCESS_STATE_FATAL,PROCESS_STATE_EXITED
command=sh -c 'printf "READY\n"; while read -r line; do echo "$line" >&2; kill -SIGQUIT "$PPID"; done'
autostart=true
autorestart=unexpected
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
