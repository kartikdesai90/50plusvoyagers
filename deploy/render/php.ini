; Production PHP settings for the Render container.

memory_limit = 512M
max_execution_time = 120

; The admin panel uploads images; intervention/image resizes them in-process.
upload_max_filesize = 32M
post_max_size = 32M

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Laravel caches config, routes and views into bootstrap/cache at deploy time,
; so opcache never needs to re-stat files it has already compiled.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
