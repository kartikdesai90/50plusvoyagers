; Supervisor configuration for the two background processes.
;
; Adapt `directory`, `user` and the binary paths to the host, then:
;   supervisorctl reread && supervisorctl update
;
; Both programs restart automatically. For the front end that is not a
; convenience: it serves every page a visitor sees, so a crash that is not
; restarted takes the whole site down rather than degrading it.

[program:50plusvoyagers-web]
process_name=%(program_name)s
; `next start` serves the build produced by `npm run build`. It renders the
; public pages and proxies /api, /images and /storage through to Laravel, which
; is what keeps the session cookie the admin panel authenticates with same-site.
command=npm --prefix /var/www/50plusvoyagers/frontend run start
directory=/var/www/50plusvoyagers/frontend
environment=NODE_ENV="production",LARAVEL_ORIGIN="http://127.0.0.1:8000"
autostart=true
autorestart=true
startretries=10
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/50plusvoyagers-web.log
stopwaitsecs=10

[program:50plusvoyagers-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/50plusvoyagers/artisan queue:work --tries=3 --max-time=3600
directory=/var/www/50plusvoyagers
autostart=true
autorestart=true
numprocs=1
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/50plusvoyagers-queue.log
; Long enough for the worker to finish the job it is holding.
stopwaitsecs=3600
