# Render blueprint — the whole application in one file.
#
# Two services and a database, all on the free plan:
#
#   50plusvoyagers-web    Next.js, public. The only thing the world talks to.
#   50plusvoyagers-api    Laravel, in a container. Answers /api and serves images.
#   50plusvoyagers-db     PostgreSQL.
#
# deploy/README.md describes a queue worker and a scheduler alongside these.
# Both are paid-only on Render and are deliberately absent — see the note above
# `databases:` for what that costs and how to add them back.
#
# Read the trade-offs in deploy/RENDER.md before putting real content behind
# this: free web services spin down after 15 minutes of inactivity, free
# instances have no persistent disk (so editor-uploaded images do not survive a
# redeploy), and a free Postgres database expires 30 days after it is created.

services:
  # ---------------------------------------------------------------------------
  # Laravel. Private service: it has no public URL, and only other services in
  # this blueprint can reach it. That is what deploy/README.md means by "bind it
  # to 127.0.0.1 and let the front end be the only thing that can reach it".
  #
  # NOTE: private services are not available on the free plan. On free, this must
  # be `type: web` instead — see deploy/RENDER.md, "The free-tier caveat".
  # ---------------------------------------------------------------------------
  - type: web
    name: 50plusvoyagers-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: 50 Plus Voyagers
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      # Generate once with `php artisan key:generate --show` and paste it into
      # the Render dashboard. sync:false keeps it out of git.
      - key: APP_KEY
        sync: false
      # The site's public address — the Next front end, not this service. Every
      # generated URL (an uploaded image, a mail link) has to be reachable on it.
      - key: APP_URL
        sync: false

      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: 50plusvoyagers-db
          property: connectionString

      # Only this service migrates. The worker and cron run the same image, and
      # three containers migrating at once is how a schema half-applies.
      - key: RUN_MIGRATIONS
        value: "true"

      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      # `sync`, not `database`: there is no queue worker on the free plan, so a
      # queued job would never be picked up. This runs it inline instead. Change
      # back to `database` the moment you add the worker service.
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local

      - key: LOG_CHANNEL
        value: stack
      - key: LOG_STACK
        value: single
      - key: LOG_LEVEL
        value: warning

      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: hello@50voyagers.com

      # Seeded by AdminUserSeeder. Set a real password in the dashboard before
      # running the seeder — the default in .env.example is `password`.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  # ---------------------------------------------------------------------------
  # Next.js. Native Node runtime — no Docker.
  #
  # LARAVEL_ORIGIN is read at BUILD time, not just start time: Next writes the
  # resolved rewrite targets into .next/routes-manifest.json when it builds. It
  # is set here as a literal rather than via fromService because a blueprint
  # cannot resolve a sibling's URL before that sibling exists on the first sync.
  # Fill it in with the API service's real URL, then redeploy. Getting this wrong
  # gives a site whose pages render but whose images and /api calls 500.
  # ---------------------------------------------------------------------------
  - type: web
    name: 50plusvoyagers-web
    runtime: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # e.g. https://50plusvoyagers-api.onrender.com — no trailing slash.
      - key: LARAVEL_ORIGIN
        sync: false
      # This service's own public address, used for canonical and og:url tags.
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_NAME
        value: 50 Plus Voyagers
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api

  # ---------------------------------------------------------------------------
  # The queue worker and the scheduler are NOT here, and that is not an omission.
  #
  # Background workers and cron jobs are both paid-only on Render, and a
  # blueprint containing either fails validation on a free workspace. Their
  # definitions are kept in deploy/RENDER.md so they can be pasted back in on a
  # paid plan without being reconstructed from memory.
  #
  # The consequence: QUEUE_CONNECTION on the API is `sync`, not `database`. Image
  # derivatives, mail and sitemap work are queued jobs, and with no worker to
  # drain the queue they would sit in the table forever. `sync` runs them inline
  # instead — slower requests, but the work actually happens.
  # ---------------------------------------------------------------------------

databases:
  - name: 50plusvoyagers-db
    plan: free
    region: oregon
    postgresMajorVersion: "16"
    databaseName: fifty_plus_voyagers
    user: voyagers
